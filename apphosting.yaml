# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 40
  maxInstances: 10

# Managed inference and extension account linking are enabled for the release canary.
# Configure public NEXT_PUBLIC_FIREBASE_* values and OWNER_EMAILS in the backend
# environment. Add Stripe secret references only after test-mode billing is ready.
env:
  - variable: APP_BASE_URL
    value: https://clarift--clarift-e4f6f.us-east4.hosted.app
    availability:
      - RUNTIME
  - variable: ENABLE_ADMIN_CENTER
    value: "true"
    availability:
      - RUNTIME
  - variable: ENABLE_DISCOUNT_ADMIN
    value: "false"
    availability:
      - RUNTIME
  - variable: ENABLE_FILE_CONVERSION
    value: "true"
    availability:
      - RUNTIME
  - variable: MARKITDOWN_COMMAND
    value: packaged
    availability:
      - RUNTIME
  - variable: ENABLE_STRIPE_CHECKOUT
    value: "false"
    availability:
      - RUNTIME
  - variable: ENABLE_PROMOTION_CODES
    value: "true"
    availability:
      - RUNTIME
  - variable: ENABLE_SUPPORT_ACCESS_REQUESTS
    value: "false"
    availability:
      - RUNTIME
  - variable: ENABLE_MANAGED_OPENROUTER
    value: "false"
    availability:
      - RUNTIME
  - variable: ENABLE_MANAGED_INFERENCE
    value: "true"
    availability:
      - RUNTIME
  - variable: ENABLE_BYOK
    value: "false"
    availability:
      - RUNTIME
  - variable: ENABLE_RAZORPAY_BILLING
    value: "false"
    availability:
      - RUNTIME
  - variable: ENABLE_EXTENSION_ACCOUNT_LINKING
    value: "true"
    availability:
      - RUNTIME
  - variable: ENABLE_PUBLIC_API
    value: "false"
    availability:
      - RUNTIME
  - variable: ENABLE_PROJECT_SHARING
    value: "true"
    availability:
      - RUNTIME
  - variable: ENABLE_USAGE_ANALYTICS
    value: "true"
    availability:
      - RUNTIME
  - variable: OWNER_EMAILS
    value: bhargavdvs2001@gmail.com
    availability:
      - RUNTIME
  - variable: PUBLIC_API_RATE_LIMIT_PER_MINUTE
    value: "30"
    availability:
      - RUNTIME
  - variable: CLARIFT_TRIAL_CREDITS
    value: "10"
    availability:
      - RUNTIME
  - variable: CLARIFT_TASK_COSTS_JSON
    value: '{"quick_refine":1,"guided_fix":2,"full_council":5,"evaluate":1,"apply_fix":2,"convert_document":0}'
    availability:
      - RUNTIME
  - variable: CLARIFT_USER_RPM
    value: "20"
    availability:
      - RUNTIME
  - variable: CLARIFT_TENANT_RPM
    value: "40"
    availability:
      - RUNTIME
  - variable: CLARIFT_TASK_CONCURRENCY
    value: "3"
    availability:
      - RUNTIME
  - variable: CLARIFT_FULL_COUNCIL_CONCURRENCY
    value: "1"
    availability:
      - RUNTIME
  - variable: CLARIFT_PROVIDER_TIMEOUT_MS
    value: "90000"
    availability:
      - RUNTIME
  - variable: CLARIFT_PROVIDER_RETRIES
    value: "1"
    availability:
      - RUNTIME
  - variable: CLARIFT_PROVIDER_CIRCUIT_FAILURES
    value: "5"
    availability:
      - RUNTIME
  - variable: CLARIFT_PROVIDER_CIRCUIT_COOLDOWN_MS
    value: "60000"
    availability:
      - RUNTIME
  - variable: PROMO_CODE_PEPPER
    secret: PROMO_CODE_PEPPER
    availability:
      - RUNTIME
  - variable: CLARIFT_API_KEY_PEPPER
    secret: CLARIFT_API_KEY_PEPPER
    availability:
      - RUNTIME
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
  - variable: FREE_DAILY_REQUEST_LIMIT
    value: "5"
    availability:
      - RUNTIME
  - variable: PRO_DAILY_REQUEST_LIMIT
    value: "200"
    availability:
      - RUNTIME
  - variable: PRO_MONTHLY_TOKEN_LIMIT
    value: "1000000"
    availability:
      - RUNTIME
  - variable: MAX_UPLOAD_SIZE_MB
    value: "10"
    availability:
      - RUNTIME
  - variable: RATE_LIMIT_WINDOW_SECONDS
    value: "60"
    availability:
      - RUNTIME
  - variable: RATE_LIMIT_MAX_REQUESTS
    value: "60"
    availability:
      - RUNTIME
  - variable: ADMIN_RATE_LIMIT_MAX_REQUESTS
    value: "20"
    availability:
      - RUNTIME
  - variable: OPENROUTER_ALLOWED_MODELS
    value: openai/gpt-4o-mini,anthropic/claude-haiku-4.5,google/gemini-3.5-flash-lite,deepseek/deepseek-chat,qwen/qwen-2.5-coder
