<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clarift Extension Settings</title><link rel="stylesheet" href="options.css"></head>
  <body>
    <main>
      <header><div class="mark">C</div><div><h1>Clarift</h1><p>Browser refinement settings</p></div></header>
      <section aria-labelledby="account-title">
        <h2 id="account-title">Clarift account</h2>
        <p id="account-status">Checking connection...</p>
        <div class="actions"><button id="connect" type="button">Connect Clarift Account</button><button id="sign-out" type="button" class="secondary">Sign Out</button></div>
        <p id="link-status" role="status"></p>
      </section>
      <form id="settings-form">
        <label for="api-base">Clarift API URL</label>
        <input id="api-base" name="apiBase" type="url" required>
        <label for="mode">Refinement mode</label>
        <select id="mode" name="mode"><option value="quick_refine">Quick Refine</option><option value="guided_fix">Guided Fix</option><option value="full_council">Full Council</option></select>
        <label for="technique">Refinement technique</label>
        <select id="technique" name="technique"><option>Zero-shot</option><option>Few-shot</option><option>Chain-of-thought</option><option>Tree-of-thoughts</option><option>Role / persona</option><option>Prompt chaining</option><option>ReAct</option><option>Meta / reflection</option></select>
        <button type="submit">Save Settings</button>
        <p id="status" role="status"></p>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
